[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "behavioral-consequence-framework"
version = "0.1.0"
description = "A comprehensive framework for analyzing, predicting, and optimizing behavioral interventions and their consequences"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "BCF Contributors"}
]
keywords = ["behavior", "psychology", "behavioral-science", "machine-learning", "intervention", "nudge", "behavioral-economics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "networkx>=3.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "ipython>=8.12.0",
    "jupyter>=1.0.0",
]
ml = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "optuna>=3.3.0",
]
viz = [
    "plotly>=5.14.0",
    "dash>=2.11.0",
]
all = [
    "behavioral-consequence-framework[dev,ml,viz]",
]

[project.urls]
Homepage = "https://github.com/yourusername/BCF--Behavioral_Consequence_Framework-"
Documentation = "https://bcf.readthedocs.io"
Repository = "https://github.com/yourusername/BCF--Behavioral_Consequence_Framework-"
Issues = "https://github.com/yourusername/BCF--Behavioral_Consequence_Framework-/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=bcf --cov-report=html --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
